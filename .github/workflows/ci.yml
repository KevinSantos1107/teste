name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: 'mock-firebase-api-key'
      VITE_FIREBASE_AUTH_DOMAIN: 'mock-project.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'mock-project'
      VITE_FIREBASE_STORAGE_BUCKET: 'mock-project.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:abcdef123456'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc -b)
        run: npx tsc -b

      - name: Run unit tests (vitest run)
        run: npx vitest run

      - name: Run linter (oxlint)
        run: npx oxlint

      - name: Build production bundle (vite build)
        run: npx vite build
